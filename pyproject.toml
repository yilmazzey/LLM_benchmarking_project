[project]
name = "llama-ft"
version = "1.0.0"
description = "Llama 3.2 Fine-Tuning for Abstract Generation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "unsloth>=2024.12",
    "transformers==4.56.2",
    "trl==0.22.2",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
    "huggingface_hub>=0.26.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu124"]
